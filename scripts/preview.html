<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>多模型对比对话 · 界面预览</title>
<!--
  开发用预览页：在普通浏览器里加载真实的 media/style.css + markdown.js + 前端模块，
  用 mock 的 acquireVsCodeApi 模拟扩展侧消息，用来验证布局、Markdown 渲染、
  并排对比、编辑提问、复制按钮等界面行为（无需启动 VS Code）。

  ⚠️ 必须用本地 HTTP 服务打开，不能直接双击（file://）：
  前端现在是原生 ESM（`<script type="module">`），浏览器会因 CORS 拒绝
  从 file:// 加载模块。在仓库根目录执行：

      python3 -m http.server 8000
      # 然后浏览器打开 http://localhost:8000/scripts/preview.html

  CSP 与真实 Webview 保持一致（见 src/webview/html.ts），所以这个页面同时
  也是「CSP 下 ESM 能否正常加载」的验证工具。改 CSP 请同步改这里。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; script-src 'nonce-dev-preview' 'strict-dynamic'" />
<link href="../media/style.css" rel="stylesheet" />
<link href="preview-theme.css" rel="stylesheet" />
</head>
<body>
<div id="app">
	<header id="toolbar">
		<div class="tb-left">
			<span class="app-title">多模型对比对话</span>
			<span id="session-title" class="session-badge"></span>
		</div>
		<div class="tb-right">
			<button id="newSession" class="btn">新建会话</button>
			<button id="toggleHistory" class="btn">历史</button>
		</div>
	</header>

	<div id="notice" class="notice"></div>

	<div id="body">
		<div class="main-col">
			<aside id="strip" class="strip hidden">
				<div id="stripList" class="strip-list"></div>
			</aside>
			<main id="messages" class="messages"></main>
		</div>
		<aside id="history" class="history">
			<div class="history-head">历史会话</div>
			<ul id="sessionList" class="session-list"></ul>
		</aside>
	</div>

	<footer id="composer">
		<div id="attachments" class="attachments"></div>
		<div class="composer-row">
			<textarea id="input" rows="1" placeholder="输入问题…（回车发送，Shift+回车换行；可粘贴或拖入图片）"></textarea>
			<div class="composer-actions">
				<button id="send" class="btn primary" disabled>发送</button>
				<button id="stop" class="btn danger" disabled>停止</button>
			</div>
		</div>
	</footer>
</div>

<script nonce="dev-preview">
	// 模拟 VS Code 的 webview API。
	// 收到的 'ready' 会触发下面的演示数据 —— 这样能保证演示数据在模块
	// 加载完、监听器挂好之后才发出去（模块脚本是 defer 的，内联脚本先执行，
	// 直接在这里发数据会因为监听器还没注册而丢失）。
	window.acquireVsCodeApi = function () {
		return {
			postMessage: (message) => {
				window.__sent = window.__sent || [];
				window.__sent.push(message);
				if (message && message.type === 'ready') {
					window.__emitDemoData();
				}
			},
			getState: () => ({}),
			setState: () => {},
		};
	};

	// 模拟扩展侧下发消息
	window.__emit = function (message) {
		window.dispatchEvent(new MessageEvent('message', { data: message }));
	};

	// ── 演示数据（只为在浏览器里试交互，删掉这段就是一个空白新会话）──
	window.__emitDemoData = function () {
		const models = [
			{ key: 'customendpoint:6-Astra', id: '6-Astra', vendor: 'customendpoint', family: 'astra', name: '6-Astra', maxInputTokens: 200000 },
			{ key: 'customendpoint:V4.1-Flash', id: 'V4.1-Flash', vendor: 'customendpoint', family: 'flash', name: 'V4.1-Flash', maxInputTokens: 200000 },
			{ key: 'customendpoint:5.6-Sol', id: '5.6-Sol', vendor: 'customendpoint', family: 'sol', name: '5.6-Sol', maxInputTokens: 200000 },
		];
		const turn = {
			id: 'demo-turn-1',
			at: Date.now(),
			prompt: '解释一下快速排序',
			images: [],
			responses: {
				'customendpoint:6-Astra': { text: '快速排序是分治算法……', status: 'done', elapsedMs: 4100 },
				'customendpoint:V4.1-Flash': { text: '它把数组分成两部分……', status: 'done', elapsedMs: 3200 },
				'customendpoint:5.6-Sol': { text: '（这一条用来试编辑）', status: 'done', elapsedMs: 5100 },
			},
		};
		window.__emit({ type: 'models', models, selected: models.map((m) => m.key), warning: '' });
		window.__emit({
			type: 'session',
			session: {
				id: 'demo-session',
				title: '解释一下快速排序',
				selectedModels: models.map((m) => m.key),
				turns: [turn],
			},
			sessions: [],
		});
	};

	// 点「仅保存 / 保存并重新生成」后，前端会把 editPrompt 记在 window.__sent 里。
	// 想模拟扩展侧回推，可在控制台执行：
	//   __emit({ type: 'prompt', turnId: 'demo-turn-1', prompt: '改过的文字',
	//            editedAt: Date.now(), title: '改过的文字', contextSource: null })
</script>
<script nonce="dev-preview" src="../media/markdown.js"></script>
<script type="module" nonce="dev-preview" src="../media/dist/webview/main.js"></script>
</body>
</html>
