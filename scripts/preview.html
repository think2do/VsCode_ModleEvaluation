<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>多模型对比对话 · 界面预览</title>
<!--
  开发用预览页：在普通浏览器里加载真实的 media/style.css + markdown.js + main.js，
  用 mock 的 acquireVsCodeApi 模拟扩展侧消息，用来验证布局、Markdown 渲染、
  拖拽宽度、复制按钮等界面行为（无需启动 VS Code）。

  注意：这里只复刻 HTML 骨架，样式与逻辑都引用真实文件，改样式请改 media/style.css。
-->
<link href="../media/style.css" rel="stylesheet" />
<style>
	/* 模拟 VS Code 深色主题变量，让预览更接近真实观感 */
	:root {
		--vscode-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
		--vscode-font-size: 13px;
		--vscode-foreground: #cccccc;
		--vscode-editor-background: #1e1e1e;
		--vscode-panel-border: rgba(128, 128, 128, 0.35);
		--vscode-button-background: #0e639c;
		--vscode-button-foreground: #ffffff;
		--vscode-button-hoverBackground: #1177bb;
		--vscode-button-secondaryBackground: rgba(128, 128, 128, 0.2);
		--vscode-button-secondaryHoverBackground: rgba(128, 128, 128, 0.3);
		--vscode-input-background: #3c3c3c;
		--vscode-input-foreground: #cccccc;
		--vscode-input-border: rgba(128, 128, 128, 0.4);
		--vscode-focusBorder: #007fd4;
		--vscode-errorForeground: #f48771;
		--vscode-textLink-foreground: #3794ff;
		--vscode-editorWidget-background: rgba(128, 128, 128, 0.06);
		--vscode-sideBarSectionHeader-background: rgba(128, 128, 128, 0.1);
		--vscode-textCodeBlock-background: rgba(0, 0, 0, 0.3);
		--vscode-textBlockQuote-background: rgba(128, 128, 128, 0.1);
		--vscode-textBlockQuote-border: rgba(128, 128, 128, 0.5);
		--vscode-list-hoverBackground: rgba(128, 128, 128, 0.12);
		--vscode-list-activeSelectionBackground: rgba(128, 128, 128, 0.25);
		--vscode-progressBar-background: #0e70c0;
		--vscode-editor-font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
		--vscode-editor-font-size: 12px;
		--vscode-testing-iconPassed: #73c991;
		--vscode-scrollbarSlider-background: rgba(121, 121, 121, 0.4);
		--vscode-scrollbarSlider-hoverBackground: rgba(100, 100, 100, 0.7);
		--vscode-scrollbarSlider-activeBackground: rgba(191, 191, 191, 0.4);
		--vscode-descriptionForeground: #9d9d9d;
		--vscode-sideBar-background: #252526;
		--vscode-charts-blue: #3794ff;
		--vscode-charts-purple: #b180d7;
		--vscode-charts-orange: #d18616;
		--vscode-charts-green: #89d185;
		--vscode-charts-red: #f14c4c;
		--vscode-charts-yellow: #cca700;
	}
</style>
</head>
<body>
<div id="app">
	<header id="toolbar">
		<div class="tb-left">
			<span class="app-title">多模型对比对话</span>
			<span id="session-title" class="session-badge"></span>
		</div>
		<div class="tb-right">
			<button id="newSession" class="btn">新建会话</button>
			<button id="toggleHistory" class="btn">历史</button>
		</div>
	</header>

	<div id="notice" class="notice"></div>

	<div id="body">
		<div class="main-col">
			<aside id="strip" class="strip hidden">
				<div id="stripList" class="strip-list"></div>
			</aside>
			<main id="messages" class="messages"></main>
		</div>
		<aside id="history" class="history">
			<div class="history-head">历史会话</div>
			<ul id="sessionList" class="session-list"></ul>
		</aside>
	</div>

	<footer id="composer">
		<div id="attachments" class="attachments"></div>
		<div class="composer-row">
			<textarea id="input" rows="1" placeholder="输入问题…（回车发送，Shift+回车换行；可粘贴或拖入图片）"></textarea>
			<div class="composer-actions">
				<button id="send" class="btn primary" disabled>发送</button>
				<button id="stop" class="btn danger" disabled>停止</button>
			</div>
		</div>
	</footer>
</div>

<script>
	// 模拟 VS Code 的 webview API，把前端发出的消息记到 window.__sent 供检查
	window.acquireVsCodeApi = function () {
		return {
			postMessage: (message) => {
				window.__sent = window.__sent || [];
				window.__sent.push(message);
			},
			getState: () => ({}),
			setState: () => {},
		};
	};

	// 模拟扩展侧下发消息
	window.__emit = function (message) {
		window.dispatchEvent(new MessageEvent('message', { data: message }));
	};
</script>
<script src="../media/markdown.js"></script>
<script src="../media/main.js"></script>
<script>
	// ── 演示数据（只为在浏览器里试「编辑提问」，删掉这段就是一个空白新会话）──
	// main.js 启动时会发 ready，这里直接替扩展侧回应 models / session。
	(function () {
		const models = [
			{ key: 'customendpoint:6-Astra', id: '6-Astra', vendor: 'customendpoint', family: 'astra', name: '6-Astra', maxInputTokens: 200000 },
			{ key: 'customendpoint:V4.1-Flash', id: 'V4.1-Flash', vendor: 'customendpoint', family: 'flash', name: 'V4.1-Flash', maxInputTokens: 200000 },
			{ key: 'customendpoint:5.6-Sol', id: '5.6-Sol', vendor: 'customendpoint', family: 'sol', name: '5.6-Sol', maxInputTokens: 200000 },
		];
		const turn = {
			id: 'demo-turn-1',
			at: Date.now(),
			prompt: '解释一下快速排序',
			images: [],
			responses: {
				'customendpoint:6-Astra': { text: '快速排序是分治算法……', status: 'done', elapsedMs: 4100 },
				'customendpoint:V4.1-Flash': { text: '它把数组分成两部分……', status: 'done', elapsedMs: 3200 },
				'customendpoint:5.6-Sol': { text: '（这一条用来试编辑）', status: 'done', elapsedMs: 5100 },
			},
		};
		window.__emit({ type: 'models', models, selected: models.map((m) => m.key), warning: '' });
		window.__emit({
			type: 'session',
			session: {
				id: 'demo-session',
				title: '解释一下快速排序',
				selectedModels: models.map((m) => m.key),
				turns: [turn],
			},
			sessions: [],
		});
		// 点「仅保存 / 保存并重新生成」后，前端会把 editPrompt 记在 window.__sent 里。
		// 想模拟扩展侧回推，可在控制台执行：
		//   __emit({ type: 'prompt', turnId: 'demo-turn-1', prompt: '改过的文字',
		//            editedAt: Date.now(), title: '改过的文字', contextSource: null })
	})();
</script>
</body>
</html>
